spring.application.name=baitaplon
spring.config.import=optional:file:./application-secret.properties

# Server Config
server.port=8080

# Database Config
spring.datasource.url=jdbc:mysql://localhost:3307/hg_ecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File upload
hg.upload.dir=uploads
hg.upload.max-file-size=5242880
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT Config
hg.app.jwtSecret=${HG_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
hg.app.jwtExpirationMs=86400000

# Gemini AI Config
gemini.api.key=${GEMINI_API_KEY:${gemini.local-api-key:}}
gemini.api.model=${GEMINI_API_MODEL:gemini-1.5-flash}

# SePay Banking Config
# Số tài khoản ngân hàng MB Bank
sepay.bank.account=7690152904691
sepay.bank.name=NGUYEN TRUONG GIANG
sepay.bank.short=MB
# Secret key dùng để xác thực webhook từ SePay (đặt lại trên SePay dashboard)
sepay.webhook.secret=${SEPAY_WEBHOOK_SECRET:HG_SEPAY_SECRET_2026}
# SePay API polling (backup cho webhook) — đặt true và sepay.api.base-url khi cần
sepay.polling.enabled=false
sepay.api.base-url=
sepay.api.key=
sepay.polling.interval-ms=30000
